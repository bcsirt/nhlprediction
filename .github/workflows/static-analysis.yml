name: Static Analysis

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  phpstan:
    name: PHPStan (Level ${{ matrix.level }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        level: [5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --level=${{ matrix.level }} --memory-limit=2G

  larastan:
    name: Larastan Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - name: Generate application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Larastan
        run: ./vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=2G
